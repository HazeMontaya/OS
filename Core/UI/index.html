<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS — Immersive AI</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="bg3d"></canvas>
<div id="hud">
  <header id="topbar">
    <div class="brand">
      <div class="orb" id="aiOrb"><div class="orb-ring"></div><div class="orb-ring r2"></div><div class="orb-core"></div></div>
      <div><h1>OS</h1><p class="sub" id="status">INITIALIZING…</p></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div id="mainGrid">
    <section class="glass panel-chat" id="chatPanel">
      <h2><span class="icon">⚡</span> Neural Link</h2>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="chat-input">
        <textarea id="prompt" rows="2" placeholder="Aufgabe an OS…" required></textarea>
        <div class="row">
          <select id="model"><option value="">Modell auto</option></select>
          <select id="provider"><option value="">Provider auto</option></select>
          <label class="toggle"><input id="remember" type="checkbox"><span class="slider"></span>Merken</label>
          <button type="submit" id="sendBtn"><span class="btn-glow"></span>Ausführen</button>
        </div>
      </form>
    </section>

    <div id="sidePanels">
      <section class="glass panel-memory">
        <h2><span class="icon">🧠</span> Memory</h2>
        <div id="memory"></div>
        <form id="memoryForm" class="mini-form"><input id="memoryText" placeholder="Memory hinzufügen" required><button>+</button></form>
      </section>
      <section class="glass panel-tools">
        <h2><span class="icon">🔧</span> Tools</h2>
        <div id="tools"></div>
      </section>
      <section class="glass panel-workflows">
        <h2><span class="icon">⚙️</span> Workflows</h2>
        <div id="workflows"></div>
      </section>
    </div>
  </div>

  <section class="glass panel-meta" id="metaPanel">
    <h2><span class="icon">📊</span> System</h2>
    <pre id="runtimeMeta"></pre>
  </section>
</div>

<script type="module" src="/app.js"></script>
<script type="module" src="/engine3d.js"></script>
</body>
</html>
