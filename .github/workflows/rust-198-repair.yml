name: Rust 1.98 Compatibility Repair

on:
  push:
    branches: [black-gold-spatial-redesign]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: black-gold-spatial-redesign
          fetch-depth: 0

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Apply deterministic compatibility repairs
        shell: python
        run: |
          from pathlib import Path

          gateway = Path('crates/model-gateway/src/lib.rs')
          text = gateway.read_text()
          old = '''    #[test]\n    fn api_keys_from_env() {\n        std::env::set_var("OPENAI_API_KEY", "test-key");\n        let keys = ApiKeys::from_env();\n        assert_eq!(keys.key_for(&CloudProvider::OpenAI), "test-key");\n        assert_eq!(keys.key_for(&CloudProvider::Anthropic), "");\n        std::env::remove_var("OPENAI_API_KEY");\n    }\n'''
          new = '''    #[test]\n    fn api_keys_select_provider_without_mutating_process_environment() {\n        let keys = ApiKeys {\n            openai: "openai-key".into(),\n            anthropic: "anthropic-key".into(),\n            openrouter: "openrouter-key".into(),\n            ollama: "ollama-key".into(),\n        };\n        assert_eq!(keys.key_for(&CloudProvider::OpenAI), "openai-key");\n        assert_eq!(keys.key_for(&CloudProvider::Anthropic), "anthropic-key");\n        assert_eq!(keys.key_for(&CloudProvider::OpenRouter), "openrouter-key");\n        assert_eq!(keys.key_for(&CloudProvider::Ollama), "ollama-key");\n        assert_eq!(keys.key_for(&CloudProvider::Custom("private".into())), "");\n    }\n'''
          if old not in text:
              raise SystemExit('Expected ApiKeys environment test was not found; refusing broad edit.')
          gateway.write_text(text.replace(old, new, 1))

          system = Path('crates/system/src/lib.rs')
          text = system.read_text()
          old_import = '        use CapabilityMode::{Allow, Ask, Deny, Sandbox};'
          if old_import not in text:
              raise SystemExit('Expected CapabilityMode import was not found; refusing broad edit.')
          system.write_text(text.replace(old_import, '        use CapabilityMode::{Allow, Ask, Sandbox};', 1))

      - name: Format
        run: cargo fmt --all

      - name: Core tests
        run: cargo test --workspace --exclude os-desktop

      - name: Core clippy
        run: cargo clippy --workspace --exclude os-desktop --all-targets -- -D warnings

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "OS CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "fix(rust): restore Rust 1.98 test and clippy compatibility"
          git push origin HEAD:black-gold-spatial-redesign
