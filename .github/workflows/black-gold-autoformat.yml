name: Black Gold Rustfmt Repair

on:
  push:
    branches: [black-gold-spatial-redesign]

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: black-gold-spatial-redesign
          fetch-depth: 0

      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: cargo fmt --all

      - name: Verify only formatting and commit when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git diff --check
          git config user.name "OS CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(rust): apply canonical rustfmt"
          git push origin HEAD:black-gold-spatial-redesign
