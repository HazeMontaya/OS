name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test OS
        run: npm test
      - name: Syntax check UI
        run: node --check Core/UI/app.js
      - name: Validate JSON configuration
        shell: bash
        run: |
          node -e "for (const f of ['Config/OS/runtime.json','Config/OS/models.json','Workspace/MCP/servers.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content $_.FullName -Raw))
          }
