name: CI
on:
  push:
  pull_request:

env:
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - continue-on-error: true
        run: cargo fmt --all -- --check
      - if: ${{ always() }}
        run: cargo test --workspace
      - if: ${{ always() }}
        run: OS_CI=1 cargo run -p os-cli
