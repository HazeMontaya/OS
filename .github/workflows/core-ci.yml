name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust cognitive core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Core tests
        run: cargo test --workspace --exclude os-desktop

      - name: Core clippy
        run: cargo clippy --workspace --exclude os-desktop --all-targets -- -D warnings

      - name: CLI runtime doctor
        run: cargo run -p os-cli -- doctor

      - name: Developer diagnostics
        run: cargo run -p os-devtools

  web-ui:
    name: Cognitive experience layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript workspace typecheck
        run: pnpm typecheck

      - name: Production web build
        run: pnpm --filter @os/desktop build

  windows-desktop:
    name: Windows launchable desktop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Windows bootstrap scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Syntax errors in $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }

      - name: Install protobuf compiler
        shell: powershell
        run: |
          choco install protoc --no-progress -y
          protoc --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript workspace typecheck
        run: pnpm typecheck

      - name: Production web build
        run: pnpm --filter @os/desktop build

      - name: Build launchable Tauri release executable
        run: pnpm build:app

      - name: Verify release executable
        shell: powershell
        run: |
          if (-not (Test-Path "target/release/os-desktop.exe")) {
            throw "target/release/os-desktop.exe was not produced"
          }
          Get-Item "target/release/os-desktop.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: os-windows-${{ github.sha }}
          path: target/release/os-desktop.exe
          if-no-files-found: error
          retention-days: 14
