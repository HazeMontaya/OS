name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust cognitive core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Core tests
        run: cargo test --workspace --exclude os-desktop

      - name: Core clippy
        run: cargo clippy --workspace --exclude os-desktop --all-targets -- -D warnings

      - name: CLI runtime doctor
        run: cargo run -p os-cli -- doctor

      - name: Developer diagnostics
        run: cargo run -p os-devtools

  web-ui:
    name: Cognitive experience layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript workspace typecheck
        run: pnpm typecheck

      - name: Production web build
        run: pnpm --filter @os/desktop build

  windows-desktop:
    name: Windows desktop compile
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        shell: powershell
        run: |
          choco install protoc --no-progress -y
          protoc --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript workspace typecheck
        run: pnpm typecheck

      - name: Production web build
        run: pnpm --filter @os/desktop build

      - name: Compile Tauri desktop
        run: cargo check -p os-desktop
