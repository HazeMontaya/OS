[package]
name = "os-desktop"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
os-contracts = { path = "../../../crates/contracts" }
os-kernel = { path = "../../../crates/kernel" }
os-model-gateway = { path = "../../../crates/model-gateway" }
os-privacy = { path = "../../../crates/privacy" }
os-semantic-index = { path = "../../../crates/semantic-index" }
tokio = { version = "1", features = ["sync"] }
serde_json.workspace = true
